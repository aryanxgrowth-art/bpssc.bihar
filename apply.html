<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Application | Rozgar Update</title><link rel="stylesheet" href="assets/style.css"></head>
<body><header><div class="wrap nav"><a class="brand" href="index.html">Rozgar<span>Update</span></a></div></header>
<main class="wrap page"><article class="formbox"><h1 id="title">Online Application</h1>
<p>Fill in your details carefully. Your application will be sent to the configured application backend.</p>
<form id="applicationForm">
<input type="hidden" name="jobId" id="jobId"><label>Full Name<input name="name" required maxlength="100"></label>
<label>Email<input type="email" name="email" required maxlength="150"></label><label>Mobile Number<input name="mobile" required pattern="[0-9]{10}" maxlength="10"></label>
<label>Date of Birth<input type="date" name="dob" required></label><label>Qualification<input name="qualification" required maxlength="100"></label>
<label>Address<textarea name="address" required maxlength="500"></textarea></label>
<label>Resume URL <small>(optional: public Google Drive/Dropbox link)</small><input type="url" name="resumeUrl"></label>
<button class="btn" type="submit">Submit Application</button><p id="status"></p></form>
</article></main><footer>© 2026 RozgarUpdate</footer>
<script src="assets/jobs.js"></script><script>
const id=new URLSearchParams(location.search).get("id"), job=jobs.find(x=>x.id===id); jobId.value=id||"";
if(job) title.textContent="Apply: "+job.title;
applicationForm.addEventListener("submit", async e=>{
 e.preventDefault(); status.textContent="Submitting...";
 const data=Object.fromEntries(new FormData(e.target).entries());
 try{
  const r=await fetch(APP_CONFIG.endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  if(!r.ok) throw new Error();
  status.textContent="Application submitted successfully.";
  e.target.reset();
 }catch(err){status.textContent="Submission failed. Configure the backend endpoint in assets/jobs.js."; }
});
</script></body></html>
